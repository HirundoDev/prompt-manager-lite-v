[package]
name = "mighty-dashboard-local"
version = "1.0.0"
description = "The Mighty Task - Dashboard Local con Svelte 5 + Tauri"
authors = ["The Mighty Task Team"]
license = "MIT"
repository = ""
default-run = "mighty-dashboard-local"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5.0", features = ["api-all", "shell-execute", "fs-all", "dialog-all", "notification-all", "os-all", "path-all"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
